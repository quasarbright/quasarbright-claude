<title>__PROJECT__ Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One narrow column, phone first: a list of what needs Mike, and one item open at a time.
   Feedback goes in the artifact's own comments; the only control on an item is Reviewed. */
:root{
  color-scheme:dark;
  --bg:#0e0f16;--panel:#171a24;--panel-2:#1f2330;--border:#2a2f3d;--border-hi:#3a4157;
  --text:#e6e8ef;--muted:#8a8fa3;--faint:#5b6072;
  --accent:#7c8cf8;--accent-hi:#9aa6ff;--on-accent:#0e0f16;
  --good:#5fd08a;--good-bg:#1b2e24;--bad:#ff8fa0;--warn:#e8b450;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--ui);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
main{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:10px;padding:18px 0 6px}
.top h1{font-size:21px;font-weight:650;margin:0}
.count{background:var(--accent);color:var(--on-accent);font-weight:700;font-size:12.5px;border-radius:20px;padding:1px 9px}
.proj{margin-left:auto;color:var(--muted);font-size:13px}
.sec{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:20px 2px 8px}
.sec span{color:var(--faint)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px}
.row:hover{border-color:var(--border-hi)}
.row.blocking{border-color:#45406a}
.thumb{width:68px;height:48px;border-radius:7px;background:var(--panel-2) center/cover no-repeat;flex:none;border:1px solid var(--border);display:grid;place-items:center;color:var(--warn);font-weight:700;font-size:20px}
.thumb.stack{box-shadow:4px -4px 0 -1px #2b3044,8px -8px 0 -2px #232838}
.row-b{flex:1;min-width:0}
.row-t{font-weight:600;font-size:15px;line-height:1.3;display:block}
.row-m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted)}
.kind{font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;background:var(--panel-2);color:var(--accent-hi)}
.kind.question{color:var(--warn)}.kind.approve{color:var(--good)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.chev{color:var(--faint);font-size:20px;flex:none}
.done-toggle{width:100%;display:flex;justify-content:space-between;background:none;border:1px dashed var(--border);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13.5px}
.empty{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px 18px;color:var(--muted);margin-top:16px}
.empty b{color:var(--text);display:block;font-size:16px;margin-bottom:4px}
.calm{margin-top:14px;background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:12px;padding:12px 14px;font-size:14px}
/* item */
.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0 4px}
.link{background:none;border:none;color:var(--accent-hi);padding:6px 0;font-size:14.5px}
.pos{color:var(--muted);font-size:13px;display:flex;gap:4px;align-items:center}
.pos .link{padding:6px 8px}
.it-title{font-size:22px;font-weight:650;line-height:1.25;margin:8px 0 4px;text-wrap:balance}
.from{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.ctx{color:#c7cbd8;margin:0 0 10px;max-width:65ch}
.ctx b{color:var(--text)}
.how{font-size:13px;color:var(--muted);margin:0 0 16px}
/* Pictures: every one the same box, so a row of options lines up on a grid. */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.seq{display:flex;flex-direction:column;gap:18px}
.shot{position:relative;border-radius:8px;overflow:hidden;background:#000}
.shot img{display:block;width:100%;height:auto;cursor:zoom-in}
.opts .shot img{aspect-ratio:3/2;object-fit:contain}
.shot.broken{display:flex;align-items:center;justify-content:center;aspect-ratio:3/2;color:var(--muted);font-size:13px;text-align:center;padding:16px}
.cmt{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;border:1px solid #ffffff33;background:#101219e6;color:#e7e9f2;display:grid;place-items:center;box-shadow:0 4px 14px #0009;padding:0}
.cmt:hover{border-color:#ffffff88;background:#1b1e29f0}
.cap{display:flex;align-items:baseline;gap:8px;padding:9px 4px 2px;font-weight:600}
.seq .cap{padding:8px 2px 0}
.num{font-family:var(--mono);color:var(--muted);font-weight:500}
.tag{font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;margin-left:auto;color:var(--muted);white-space:nowrap}
.tag.rec{color:var(--good)}
.desc{font-size:13px;color:var(--muted);padding:0 4px 4px}
.seq .desc{padding:2px 2px 0}
.src{align-self:flex-start;margin:0 4px;color:var(--accent-hi);font-size:12.5px;padding:2px 0;text-decoration:none}.src:hover{text-decoration:underline}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.qopt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.qopt .tag{margin-left:6px}
.was{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:16px;color:#c7cbd8}
.was b{color:var(--text)}
.was .note{margin-top:4px;white-space:pre-wrap}
/* The one control: Reviewed, in a sticky bar at the bottom. */
.foot{position:sticky;bottom:0;z-index:5;background:var(--bg);padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));margin-top:16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border-radius:10px;padding:12px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:650;font-size:15px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:13.5px;color:var(--muted);flex:1 1 220px;min-width:0}
.status.ok{color:var(--good)}.status.err{color:var(--bad)}
.revd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--good);font-weight:600}
.revd .link{font-weight:400;font-size:14px}
/* Enlarged view */
.lb{position:fixed;inset:0;z-index:20;background:#07080c;display:grid;grid-template:"bar" auto "stage" minmax(0,1fr) "foot" auto / minmax(0,1fr);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body.lb-open{overflow:hidden}
.lb-bar{grid-area:bar;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:var(--muted);font-size:13px;gap:12px;min-width:0}
.lb-cap{display:flex;gap:10px;align-items:baseline;min-width:0}.lb-cap b{color:var(--text);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lb-cap span{white-space:nowrap}
.lb-tools{display:flex;gap:16px;flex:none}
.lb-stage{grid-area:stage;position:relative;min-height:0;display:flex}
.lb-scroll{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:0 64px 16px;min-height:0}
.lb-scroll img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lb.full .lb-scroll{align-items:flex-start;justify-content:flex-start}
.lb.full .lb-scroll img{max-width:none;max-height:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:#14161dcc;color:var(--text);display:grid;place-items:center;z-index:2}
.lb-nav:hover{background:var(--panel-2);border-color:var(--accent)}
.lb-nav.prev{left:10px}.lb-nav.next{right:10px}
.lb-foot{grid-area:foot;height:64px;padding:8px 72px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden;border-top:1px solid #1c1f2a}
.lb-foot b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lb-foot span{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:760px){
  .lb-cap b{display:none}
  .lb-scroll{padding:0 8px 8px}
  .lb-nav{width:40px;height:40px;top:auto;bottom:14px;transform:none}
  .lb-foot{padding:8px 60px 12px}
}
@media (max-width:480px){.it-title{font-size:20px}.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .12s}}
</style>

<main id="app"><div class="empty"><b>Loading what needs you…</b>This page reads its items from its own store.</div></main>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Enlarged picture" data-uncommentable></div>

<script>
// Items live in the page's db, collection "items" (one doc each). Claude writes them. Mike comments with the
// artifact's own comments and presses Reviewed when he has said everything about an item.
// Item: {title, kind: "pick"|"approve"|"question", blocking, from, context, created (ISO),
//   options:[{id,label,desc,img,tag,link,source}], recommended, recommendReason, images:[{img,title,desc}],
//   status: "open"|"reviewed"|"chat"|"done" (older pages also wrote "answered", with answer:{label,note,...}),
//   reviewedAt}
const S = { items: [], meta: {}, showDone: false, status: {}, ready: false, err: null, lb: null, lbFull: false };
let db = null, comments = null, canWrite = true, listen = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = (iso) => {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + " h ago";
  return Math.round(h / 24) + " d ago";
};
const KIND = { pick: "Choice", approve: "Look over", question: "Question" };
const kindLabel = (it) => it.kind === "pick" ? `Choice · ${(it.options || []).length}` : it.kind === "approve" && (it.images || []).length > 1 ? `Look over · ${it.images.length} shots` : KIND[it.kind] || it.kind;
const thumbOf = (it) => (it.options || []).find((o) => o.img)?.img || (it.images || [])[0]?.img;
const byNew = (a, b) => String(b.created || "").localeCompare(String(a.created || ""));
const stOf = (it) => it.status === "answered" ? "reviewed" : it.status || "open";
const groups = () => {
  const open = S.items.filter((i) => stOf(i) === "open");
  return {
    blocking: open.filter((i) => i.blocking).sort(byNew),
    look: open.filter((i) => !i.blocking).sort(byNew),
    chat: S.items.filter((i) => stOf(i) === "chat").sort(byNew),
    reviewed: S.items.filter((i) => stOf(i) === "reviewed").sort(byNew),
    done: S.items.filter((i) => stOf(i) === "done").sort(byNew),
  };
};
const queue = () => { const g = groups(); return [...g.blocking, ...g.look]; };
const currentId = () => (location.hash.startsWith("#i-") ? decodeURIComponent(location.hash.slice(3)) : null);
const isRec = (it, id) => Array.isArray(it.recommended) ? it.recommended.includes(id) : it.recommended === id;
const ICO_CMT = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>';
const ARROW = (d) => `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d < 0 ? "M15 5l-7 7 7 7" : "M9 5l7 7-7 7"}"/></svg>`;

function row(it) {
  const t = thumbOf(it), many = it.kind === "pick" || (it.images || []).length > 1, st = stOf(it);
  const meta = st === "chat" ? "Talking in the project chat" : st === "reviewed" ? `You reviewed it ${ago(it.reviewedAt || it.answer?.at)} · waiting on Claude` : st === "done" ? "Done" : `${esc(it.from || "")}${it.from ? " · " : ""}${ago(it.created)}`;
  return `<button class="row ${it.blocking && st === "open" ? "blocking" : ""}" data-open="${esc(it.id)}">
    <span class="thumb ${t && many ? "stack" : ""}" ${t ? `style="background-image:url('${esc(t)}')"` : ""}>${t ? "" : it.kind === "question" ? "?" : "·"}</span>
    <span class="row-b"><span class="row-t">${esc(it.title)}</span><span class="row-m"><span class="kind ${esc(it.kind)}">${kindLabel(it)}</span>${meta}</span></span>
    ${st === "open" ? `<span class="dot" aria-label="needs you"></span>` : `<span class="chev">›</span>`}</button>`;
}
const section = (title, list) => list.length ? `<div class="sec">${title} <span>${list.length}</span></div><div class="list">${list.map(row).join("")}</div>` : "";
function renderList() {
  const g = groups(), n = g.blocking.length + g.look.length;
  let h = `<div class="top"><h1>Needs you</h1>${n ? `<span class="count">${n}</span>` : ""}<span class="proj">${esc(S.meta.project || "")}</span></div>`;
  if (S.err) h += `<div class="empty"><b>Can't load the items.</b>${esc(S.err)}</div>`;
  else if (!S.ready) h += `<div class="empty"><b>Loading what needs you…</b>This page reads its items from its own store.</div>`;
  else if (!S.items.length) h += `<div class="empty"><b>Nothing needs you.</b>When a thread has something to look at, a choice or a question, it shows up here.</div>`;
  else {
    if (!n) h += `<div class="empty"><b>You're caught up.</b>Nothing is waiting on you right now.</div>`;
    h += section("Blocking work", g.blocking) + section("Look when you can", g.look) + section("Talking in chat", g.chat) + section("Reviewed, waiting on Claude", g.reviewed);
    if (g.done.length) h += `<div class="sec"></div><button class="done-toggle" id="doneT"><span>Done · ${g.done.length}</span><span>${S.showDone ? "hide" : "show"}</span></button>${S.showDone ? `<div class="list" style="margin-top:8px">${g.done.map(row).join("")}</div>` : ""}`;
  }
  $("#app").innerHTML = h;
  $("#doneT")?.addEventListener("click", () => { S.showDone = !S.showDone; render(); });
}

// Every picture an item shows, in order: choice options with a picture, or a sequence's shots.
function imagesOf(it) {
  if (it.kind === "pick") return (it.options || []).map((o, i) => ({ o, i })).filter((x) => x.o.img).map(({ o, i }) => ({ img: o.img, n: i + 1, label: o.label, desc: o.desc, opt: o }));
  if (it.kind === "approve") return (it.images || []).map((m, i) => ({ img: m.img, n: i + 1, label: m.title || "", desc: m.desc }));
  return [];
}
// Stable ids on everything Mike might comment on, so a comment stays on its picture or line.
const cid = (it, part) => `c-${it.id}-${part}`.replace(/[^A-Za-z0-9_-]/g, "_");
function shot(it, x, lbi) {
  return `<div class="shot" id="${cid(it, "pic" + x.n)}" data-comment-target><img src="${esc(x.img)}" alt="${esc(`${x.n} · ${x.label}`)}" loading="lazy" referrerpolicy="no-referrer" data-lbi="${lbi}"><button class="cmt" data-cmt="${cid(it, "pic" + x.n)}" title="Comment on picture ${x.n}" aria-label="Comment on picture ${x.n}">${ICO_CMT}</button></div>`;
}
function body(it) {
  const xs = imagesOf(it);
  if (it.kind === "pick") {
    return `<div class="opts">${(it.options || []).map((o, i) => { const k = xs.findIndex((x) => x.opt === o); return `
      <div class="card" id="${cid(it, "opt" + (i + 1))}" data-comment-target>
        ${k >= 0 ? shot(it, xs[k], k) : ""}
        <div class="cap"><span><span class="num">${i + 1}</span> · ${esc(o.label)}</span>${isRec(it, o.id) ? `<span class="tag rec">Recommended</span>` : o.tag ? `<span class="tag">${esc(o.tag)}</span>` : ""}</div>
        ${o.desc ? `<div class="desc">${esc(o.desc)}</div>` : ""}
        ${o.link ? `<a class="src" href="${esc(o.link)}" target="_blank" rel="noopener noreferrer">${esc(o.source || "Source")} ↗</a>` : ""}
      </div>`; }).join("")}</div>`;
  }
  if (it.kind === "question") {
    return `<div class="qopts">${(it.options || []).map((o, i) => `<div class="qopt" id="${cid(it, "opt" + (i + 1))}" data-comment-target><span class="num">${i + 1}</span> · ${esc(o.label)}${isRec(it, o.id) ? `<span class="tag rec">Recommended</span>` : ""}${o.desc ? `<small>${esc(o.desc)}</small>` : ""}</div>`).join("")}</div>`;
  }
  return `<div class="seq">${xs.map((x, i) => `<div>${shot(it, x, i)}<div class="cap"><span><span class="num">${x.n}</span> · ${esc(x.label)}</span></div>${x.desc ? `<div class="desc">${esc(x.desc)}</div>` : ""}</div>`).join("")}</div>`;
}
// What an older version of the page recorded as his answer, read-only.
function was(it) {
  const a = it.answer; if (!a || !(a.label || a.note || a.notes)) return "";
  const notes = Object.values(a.notes || {}).filter((t) => (t || "").trim());
  return `<div class="was"><b>Your earlier answer:</b> ${esc(a.label || "")}${a.note ? `<div class="note">${esc(a.note)}</div>` : ""}${notes.map((t) => `<div class="note">${esc(t)}</div>`).join("")}</div>`;
}
function foot(it) {
  const st = stOf(it), s = S.status[it.id] || {};
  if (st === "reviewed" || st === "done") return `<div class="foot"><div class="revd">✓ ${st === "done" ? "Done" : `Reviewed ${ago(it.reviewedAt || it.answer?.at)}`}${st === "reviewed" && canWrite ? `<button class="link" data-act="reopen">Not done reviewing</button>` : ""}</div><div class="status ${s.cls || ""}" role="status">${esc(s.text || "")}</div></div>`;
  if (st === "chat") return `<div class="foot"><div class="status">Talking about this in the project chat.</div>${canWrite ? `<button class="btn" data-act="reviewed">Reviewed</button>` : ""}</div>`;
  if (!canWrite) return `<div class="foot"><div class="status">You can look at this, but only the project owner can mark it reviewed.</div></div>`;
  return `<div class="foot"><button class="btn" data-act="reviewed" ${s.busy ? "disabled" : ""}>Reviewed</button><div class="status ${s.cls || ""}" role="status">${esc(s.text || "")}</div></div>`;
}
function renderItem(id) {
  const it = S.items.find((i) => i.id === id);
  if (!it) { S.lb = null; renderLb(null); $("#app").innerHTML = `<div class="nav"><button class="link" data-back>‹ Needs you</button></div><div class="empty"><b>${S.ready ? "This item is gone." : "Loading…"}</b>${S.ready ? "It was finished or removed." : ""}</div>`; return; }
  const q = queue(), k = q.findIndex((i) => i.id === id);
  $("#app").innerHTML = `<div class="nav"><button class="link" data-back>‹ Needs you</button>${k >= 0 ? `<span class="pos">${k > 0 ? `<button class="link" data-go="${esc(q[k - 1].id)}" aria-label="Previous">‹</button>` : ""}${k + 1} of ${q.length}${k < q.length - 1 ? `<button class="link" data-go="${esc(q[k + 1].id)}" aria-label="Next">›</button>` : ""}</span>` : ""}</div>
    <div class="it-title" id="${cid(it, "title")}" data-comment-target>${esc(it.title)}</div>
    <div class="from">${esc(it.from || "")}${it.from ? " · " : ""}${ago(it.created)}${it.blocking ? " · blocking work" : ""}</div>
    ${it.context ? `<p class="ctx" id="${cid(it, "context")}" data-comment-target>${esc(it.context)}${it.recommendReason ? ` <b>${esc(it.recommendReason)}</b>` : ""}</p>` : ""}
    ${stOf(it) === "open" ? `<p class="how">Comment on any picture or line, and choose Send to Claude in the comment box. Press Reviewed when you've said everything.</p>` : ""}
    ${body(it)}${was(it)}${foot(it)}`;
  renderLb(S.lb && S.lb.id === it.id ? it : null);
}
function renderLb(it) {
  const el = $("#lb"), imgs = it ? imagesOf(it) : [];
  if (!S.lb || !it || !imgs.length) { el.hidden = true; el.innerHTML = ""; document.body.classList.remove("lb-open"); return; }
  const i = ((S.lb.i % imgs.length) + imgs.length) % imgs.length; S.lb.i = i;
  const x = imgs[i], many = imgs.length > 1;
  el.classList.toggle("full", S.lbFull);
  el.innerHTML = `<div class="lb-bar"><span class="lb-cap"><b>${esc(it.title)}</b><span>${x.n} of ${imgs.length}</span></span><span class="lb-tools"><button class="link" data-lbcmt="${cid(it, "pic" + x.n)}">Comment</button><button class="link" data-lbfull>${S.lbFull ? "Fit to screen" : "Actual size"}</button><button class="link" data-lbclose>Close</button></span></div>
    <div class="lb-stage">${many ? `<button class="lb-nav prev" data-lbgo="-1" aria-label="Previous picture">${ARROW(-1)}</button>` : ""}<div class="lb-scroll"><img src="${esc(x.img)}" alt="${esc(`${x.n} · ${x.label}`)}" referrerpolicy="no-referrer"></div>${many ? `<button class="lb-nav next" data-lbgo="1" aria-label="Next picture">${ARROW(1)}</button>` : ""}</div>
    <div class="lb-foot"><b>${x.n} · ${esc(x.label)}${x.opt && isRec(it, x.opt.id) ? ` <span class="tag rec" style="margin-left:6px">Recommended</span>` : ""}</b>${x.desc ? `<span>${esc(x.desc)}</span>` : ""}</div>`;
  el.hidden = false; document.body.classList.add("lb-open");
}
// Push only: Reviewed goes out with Send to Claude, so say up front when no Claude session can hear it.
async function checkListen() {
  let v = "off";
  try { v = comments ? await comments.canSendToClaude() : "off"; } catch (e) { v = "off"; }
  if (v !== listen) { listen = v; render(); }
}
const banner = () => !S.ready || listen === "available" ? "" : `<div class="calm" role="status">Claude isn't listening right now. Your comments and Reviewed marks still save here; when you're done, let Claude know in the project chat.</div>`;
function render() { const id = currentId(); if (id) renderItem(id); else { S.lb = null; renderLb(null); renderList(); } const b = banner(); if (b) $("#app").insertAdjacentHTML("afterbegin", b); }
function setStatus(it, text, cls, busy) { S.status[it.id] = { text, cls, busy }; render(); }

// The artifact's own comment box, opened on a picture or line.
async function openComment(elId) {
  const el = document.getElementById(elId); if (!el) return;
  if (!comments) { alertLine("Comments aren't available in this view. Use the comment tool in the page's toolbar."); return; }
  try { await comments.openComposer({ element: el }); } catch (e) { alertLine("Couldn't open the comment box here. Use the comment tool in the page's toolbar."); }
}
function alertLine(t) { const it = S.items.find((i) => i.id === currentId()); if (it) setStatus(it, t, "err"); }

async function markReviewed(it) {
  const ref = db.collection("items").doc(it.id), at = new Date().toISOString();
  setStatus(it, "Saving…", "", true);
  try { await ref.update({ status: "reviewed", reviewedAt: at }); }
  catch (e) { setStatus(it, "Couldn't save that: " + (e?.message || "try again"), "err"); return; }
  const text = `[review ${it.id}] Mike marked "${it.title}" reviewed. His feedback is in the comments on this item.`;
  const r = await tellClaude(text, document.getElementById(cid(it, "title")));
  setStatus(it, r.text, r.ok ? "ok" : "");
}
const NOT_HEARD = "Saved. Claude isn't listening right now, so let Claude know in the project chat.";
async function tellClaude(text, el) {
  if (!comments) return { ok: false, text: NOT_HEARD };
  try {
    const can = await comments.canSendToClaude();
    if (can !== "available") return { ok: false, text: can === "writers_only" ? "Saved. Only the page's owner can send to Claude from it." : NOT_HEARD };
    const anchor = await comments.anchorFor(el || document.querySelector(".it-title"));
    await comments.sendToClaude({ anchor, text });
    return { ok: true, text: "Saved and sent to Claude." };
  } catch (e) {
    if (e?.code === "consent_required") return { ok: false, text: "Saved, but not sent: allow this page to comment for you when claude.ai asks, then press Reviewed again." };
    return { ok: false, text: "Saved, but sending to Claude failed (" + (e?.code || "error") + "). Mention it in the project chat." };
  }
}
async function reopen(it) {
  S.status[it.id] = {};
  try { await db.collection("items").doc(it.id).update({ status: "open" }); }
  catch (e) { setStatus(it, "Couldn't reopen it: " + (e?.message || "try again"), "err"); }
}

const lbItem = () => S.items.find((t) => t.id === S.lb?.id);
document.addEventListener("click", (e) => {
  const t = e.target;
  const c = t.closest("[data-cmt]"); if (c) { e.stopPropagation(); openComment(c.dataset.cmt); return; }
  const lbc = t.closest("[data-lbcmt]"); if (lbc) { const id = lbc.dataset.lbcmt; S.lb = null; render(); document.getElementById(id)?.scrollIntoView({ block: "center" }); openComment(id); return; }
  const z = t.closest(".shot img"); if (z && !t.closest("#lb")) { S.lb = { id: currentId(), i: +z.dataset.lbi || 0 }; S.lbFull = false; render(); return; }
  if (t.closest("[data-lbclose]")) { S.lb = null; render(); return; }
  const g = t.closest("[data-lbgo]"); if (g) { S.lb.i += +g.dataset.lbgo; render(); return; }
  if (t.closest("[data-lbfull]")) { S.lbFull = !S.lbFull; render(); return; }
  const o = t.closest("[data-open]"); if (o) { location.hash = "i-" + encodeURIComponent(o.dataset.open); return; }
  if (t.closest("[data-back]")) { location.hash = ""; return; }
  const go = t.closest("[data-go]"); if (go) { location.hash = "i-" + encodeURIComponent(go.dataset.go); return; }
  const a = t.closest("[data-act]"); if (a) { const it = S.items.find((i) => i.id === currentId()); if (!it) return; if (a.dataset.act === "reviewed") markReviewed(it); else if (a.dataset.act === "reopen") reopen(it); }
});
document.addEventListener("keydown", (e) => {
  if (!S.lb) return;
  if (e.key === "Escape") { e.preventDefault(); S.lb = null; render(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); S.lb.i--; render(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); S.lb.i++; render(); }
});
document.addEventListener("error", (e) => { const im = e.target; if (!(im instanceof HTMLImageElement)) return; const sh = im.closest(".shot"); if (!sh || sh.classList.contains("broken")) return; sh.classList.add("broken"); sh.textContent = "This picture didn't load here."; }, true);
addEventListener("hashchange", () => { S.lb = null; render(); scrollTo(0, 0); checkListen(); });

(async () => {
  const timer = setTimeout(() => { if (!S.ready) { S.err = "The store didn't answer. Reload the page to try again."; render(); } }, 10000);
  db = await claude.use("db");
  if (!db) { clearTimeout(timer); S.err = "Open this page signed in to claude.ai to see what needs you."; render(); return; }
  claude.use("comments").then((c) => { comments = c; checkListen(); });
  addEventListener("focus", checkListen); document.addEventListener("visibilitychange", () => { if (!document.hidden) checkListen(); });
  claude.use("user").then((u) => { if (u) Promise.resolve(u.can ? u.can("data.write") : null).then((v) => { if (v === false) { canWrite = false; render(); } }); });
  db.doc("meta/page").onSnapshot((s) => { S.meta = (s.exists && s.data()) || {}; render(); }, () => {});
  db.collection("items").onSnapshot((snap) => {
    clearTimeout(timer);
    S.items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.ready = true; S.err = null; render();
  }, (e) => { clearTimeout(timer); S.err = "Couldn't read the items (" + (e?.code || "error") + ")."; render(); });
})();
render();
</script>
